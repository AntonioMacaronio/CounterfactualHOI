<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .agent { fill: #e8f0fe; stroke: #2d5be3; stroke-width: 2; }
      .code { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
      .out { fill: #e7f6ec; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; }
      .sub { font-size: 12px; fill: #4b5563; font-style: italic; }
      .head { font-weight: 700; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      .edge { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .lab { font-size: 12px; fill: #111827; font-weight: 600; }
      .labsub { font-size: 11.5px; fill: #4b5563; }
    </style>
  </defs>
  <rect width="1200" height="770" fill="#ffffff"/>

  <!-- initial reconstruction -->
  <rect class="code" x="30" y="40" width="230" height="82" rx="8"/>
  <text class="title" x="46" y="66">Initial reconstruction</text>
  <text x="46" y="88">run_fprecon.sh: object poses,</text>
  <text x="46" y="105">MANO hand, masks, depth</text>

  <!-- table-anchored depth -->
  <rect class="code" x="30" y="152" width="230" height="110" rx="8"/>
  <text class="title" x="46" y="178">Table-anchored depth</text>
  <text class="sub" x="46" y="196">harness code, no LLM</text>
  <text x="46" y="218">Each frame's depth is scaled so</text>
  <text x="46" y="235">the table is one plane for the</text>
  <text x="46" y="252">whole clip</text>

  <!-- automatic fit -->
  <rect class="code" x="30" y="292" width="230" height="145" rx="8"/>
  <text class="title" x="46" y="318">Automatic fit</text>
  <text class="sub" x="46" y="336">harness code, no LLM</text>
  <text x="46" y="358">Over the whole clip:</text>
  <text x="46" y="376">· object → masks + depth</text>
  <text x="46" y="394">· MANO hand → keypoints,</text>
  <text x="46" y="411">  masks, depth</text>
  <text class="head" x="46" y="429">Result: v1</text>

  <!-- reconstruction agent -->
  <rect class="agent" x="340" y="40" width="430" height="350" rx="10"/>
  <text class="title" x="358" y="68">Reconstruction agent</text>
  <text class="sub" x="358" y="86">the only one with tools; up to 60 turns / 40 min</text>
  <text x="358" y="110">Labels the motion phases, then fixes one issue at a time.</text>
  <text x="358" y="127">Every edit is a new version and returns before / after</text>
  <text x="358" y="144">metrics and images; the agent keeps it or reverts.</text>
  <text class="head" x="358" y="170">Tools</text>
  <text x="358" y="190"><tspan class="head">look</tspan>  <tspan class="mono">inspect, view3d, view_motion, zoom, plot, metrics</tspan></text>
  <text x="358" y="210"><tspan class="head">phases</tspan>  <tspan class="mono">set_phases</tspan></text>
  <text x="358" y="230"><tspan class="head">object pose</tspan>  <tspan class="mono">rotate_object, translate_object,</tspan></text>
  <text class="mono" x="372" y="247">interpolate_object, hold_object_static, smooth_object,</text>
  <text class="mono" x="372" y="264">snap_object_to_table, fit_object_silhouette, …</text>
  <text x="358" y="284"><tspan class="head">object shape</tspan>  <tspan class="mono">fit_object_thickness, scale_object</tspan></text>
  <text x="358" y="304"><tspan class="head">table</tspan>  <tspan class="mono">fit_table</tspan></text>
  <text x="358" y="324"><tspan class="head">hand (MANO)</tspan>  <tspan class="mono">fit_mano, move_hand, curl_finger,</tspan></text>
  <text class="mono" x="372" y="341">attach_hand_to_object, separate_hand, smooth_hand, …</text>
  <text x="358" y="361"><tspan class="head">control</tspan>  <tspan class="mono">history, revert, finish</tspan></text>
  <text class="sub" x="358" y="380">a second, shorter pass runs if the reviewer still finds problems</text>

  <!-- reviewer -->
  <rect class="agent" x="870" y="40" width="300" height="230" rx="10"/>
  <text class="title" x="888" y="68">Reviewer agent</text>
  <text class="sub" x="888" y="86">fresh context, no tools</text>
  <text x="888" y="110">Absolute check: is this result right</text>
  <text x="888" y="127">for a robot to replay?</text>
  <text class="head" x="888" y="151">Sees</text>
  <text x="888" y="169">every phase: the video frame with</text>
  <text x="888" y="186">the reconstruction, the 3D scene</text>
  <text x="888" y="203">from four sides, hand paths</text>
  <text class="head" x="888" y="227">Returns</text>
  <text x="888" y="245">problems: severity, frames, hint</text>

  <!-- verifier -->
  <rect class="agent" x="340" y="470" width="430" height="170" rx="10"/>
  <text class="title" x="358" y="498">Verifier agent</text>
  <text class="sub" x="358" y="516">fresh context, no tools; one call per changed frame range</text>
  <text x="358" y="540">Blind A/B: the automatic fit and the agent's version of the</text>
  <text x="358" y="557">same frames, in random order. Which fits the video better?</text>
  <text x="358" y="574">Where the hand holds the object: is it really held?</text>
  <text class="head" x="358" y="598">Returns</text>
  <text x="358" y="616">winner + confidence for each range</text>

  <!-- merge -->
  <rect class="code" x="870" y="470" width="300" height="170" rx="8"/>
  <text class="title" x="888" y="498">Merge</text>
  <text class="sub" x="888" y="516">harness code, no LLM</text>
  <text x="888" y="540">Ranges where the automatic fit</text>
  <text x="888" y="557">won (confidence ≥ 0.6) are set</text>
  <text x="888" y="574">back to it; the agent's version is</text>
  <text x="888" y="591">kept everywhere else.</text>
  <text x="888" y="615">Seams are blended and smoothed.</text>

  <!-- output -->
  <rect class="out" x="870" y="690" width="300" height="62" rx="8"/>
  <text class="title" x="888" y="716">Refined reconstruction</text>
  <text x="888" y="738">report + export → viewer, retargeting</text>

  <!-- edges -->
  <path class="edge" d="M145,122 L145,152"/>
  <path class="edge" d="M145,262 L145,292"/>
  <path class="edge" d="M260,340 L340,340"/>
  <text class="lab" x="268" y="332">v1: start</text>
  <path class="edge" d="M145,437 L145,555 L340,555"/>
  <text class="lab" x="158" y="545">v1: the baseline</text>

  <path class="edge" d="M770,100 L870,100"/>
  <text class="lab" x="782" y="92">calls finish</text>
  <path class="edge" d="M870,200 L770,200"/>
  <text class="lab" x="786" y="192">problems</text>
  <text class="labsub" x="778" y="218">fix them, then</text>
  <text class="labsub" x="778" y="233">finish again</text>

  <path class="edge" d="M555,390 L555,470"/>
  <text class="lab" x="567" y="424">result + the frame ranges it changed</text>
  <text class="labsub" x="567" y="441">held span = one range; the rest ≤ 60 frames each</text>

  <path class="edge" d="M770,555 L870,555"/>
  <text class="lab" x="786" y="547">verdicts</text>

  <path class="edge" d="M1020,470 L1020,270"/>
  <text class="lab" x="1008" y="352" text-anchor="end">merged result</text>
  <text class="labsub" x="1008" y="369" text-anchor="end">problems left → second pass</text>
  <text class="labsub" x="1008" y="384" text-anchor="end">of the reconstruction agent</text>

  <path class="edge" d="M1020,640 L1020,690"/>

  <!-- legend -->
  <rect class="agent" x="30" y="668" width="26" height="18" rx="4"/>
  <text x="66" y="682">LLM call: Claude Opus 5.5 on Amazon Bedrock</text>
  <rect class="code" x="30" y="698" width="26" height="18" rx="4"/>
  <text x="66" y="712">harness code (scripts/refine/agent.py)</text>
  <rect class="out" x="30" y="728" width="26" height="18" rx="4"/>
  <text x="66" y="742">output</text>
</svg>
